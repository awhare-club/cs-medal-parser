[project]
name = "cs-medal-parser"
version = "2.1.0"
description = "Parse and download Counter-Strike collectible medals, coins, pins, and badges."
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pillow>=11.3.0",
    "pydantic-settings>=2.10.1",
    "pydantic>=2.11.7",
    "requests>=2.32.5",
    "urllib3>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/awhare-club/cs-medal-parser"
Documentation = "https://bymykel.com/CSGO-API/"

[project.scripts]
cs-medal-parser = "cs_medal_parser.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.13.0",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
